<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnam CityLens</title>
<meta name="description" content="Flood, air and heat risk for Vietnamese cities from real terrain, OpenStreetMap and live forecasts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="./" aria-label="Vietnam CityLens">
      <span class="logo" aria-hidden="true"><i></i></span>
      <span class="brand-t"><b>CityLens</b><small data-i="brandSub"></small></span>
    </a>
    <nav class="modes" id="modes" role="tablist" aria-label="mode">
      <button data-mode="flood" role="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M12 3s-4 4.5-4 7a4 4 0 0 0 8 0c0-2.5-4-7-4-7z"/></svg><span data-i="mFlood"></span></button>
      <button data-mode="air" role="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg><span data-i="mAir"></span></button>
      <button data-mode="heat" role="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i="mHeat"></span></button>
    </nav>
    <nav class="cities" id="cities" role="tablist"></nav>
    <div class="lang" role="group" aria-label="language">
      <button data-lang="ko">KO</button><button data-lang="vi">VI</button><button data-lang="en">EN</button>
    </div>
  </header>

  <main class="stage">
    <div id="map" class="map"></div>

    <div class="hero" id="hero">
      <div class="live-dot"><i></i><span data-i="live"></span></div>
      <h1 id="headline"></h1>
      <p id="subline"></p>
    </div>

    <div class="map-tools">
      <button id="btn3d" class="tool" aria-pressed="false"><span>3D</span></button>
      <button id="btnRoads" class="tool on" aria-pressed="true"><span data-i="roads"></span></button>
    </div>

    <div class="legend" id="legend"></div>

    <aside class="panel" id="panel">
      <section class="sec clim cl-now-sec">
        <div class="sec-h"><h2 id="clTitle"></h2><span class="upd" id="clUpd"></span></div>
        <div id="clNow"></div>
      </section>
      <section class="sec clim cl-time-sec">
        <div class="sec-h"><h2 data-i="clMapT"></h2></div>
        <div class="cl-time">
          <button id="clPlay" class="btn-dark round" aria-label="play"><i class="ic-play"></i><i class="ic-pause"></i></button>
          <div class="cl-tl"><b id="clTime"></b><small data-i="clMapSub"></small></div>
          <button id="clNowBtn" class="btn-line sm"><span data-i="clToNow"></span></button>
        </div>
        <div class="slider cl-slider"><input type="range" id="clRange" min="0" max="71" step="1" value="0" aria-label="time"></div>
      </section>
      <section class="sec clim cl-rank-sec">
        <div class="sec-h"><h2 id="clRankT"></h2></div>
        <p class="cl-share" id="clShare"></p>
        <ol class="rank" id="clRank"></ol>
      </section>

      <section class="sec live fl">
        <div class="sec-h"><h2 data-i="nowTitle"></h2><span class="upd" id="upd"></span></div>
        <div class="cards3">
          <article class="lc" id="lcTide"></article>
          <article class="lc" id="lcRain"></article>
          <article class="lc" id="lcRiver"></article>
        </div>
      </section>

      <section class="sec water fl">
        <div class="sec-h"><h2 data-i="waterTitle"></h2></div>
        <p class="lead" data-i="waterLead"></p>
        <div class="lvl">
          <div class="lvl-num"><b id="lvNum">0.0</b><span>m</span><small data-i="asl"></small></div>
          <div class="lvl-btns">
            <button id="btnPlay" class="btn-dark"><i class="ic-play"></i><span data-i="play"></span></button>
            <button id="btnTide" class="btn-line" hidden><span data-i="setTide"></span></button>
          </div>
        </div>
        <div class="slider">
          <input type="range" id="lv" min="0" max="6" step="0.1" value="0" aria-label="water level">
          <div class="ticks" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6 m</span></div>
          <div class="tide-mark" id="tideMark" hidden><i></i><span id="tideMarkT"></span></div>
        </div>
      </section>

      <section class="sec impact fl">
        <div class="sec-h"><h2 data-i="impactTitle"></h2><span class="chip" id="impactLv"></span></div>
        <div class="kpi-big">
          <div class="kb-v"><b id="kArea">0</b><span>km²</span></div>
          <div class="kb-t"><span data-i="kArea"></span><div class="bar"><i id="kAreaBar"></i></div><small id="kAreaPct"></small></div>
        </div>
        <div class="kpis">
          <button class="kpi" data-type="hospital"><i class="dot hospital"></i><b id="kHospital">0</b><span data-i="tHospital"></span><small id="kHospitalOf"></small></button>
          <button class="kpi" data-type="school"><i class="dot school"></i><b id="kSchool">0</b><span data-i="tSchool"></span><small id="kSchoolOf"></small></button>
          <button class="kpi" data-type="police"><i class="dot police"></i><b id="kPolice">0</b><span data-i="tPolice"></span><small id="kPoliceOf"></small></button>
          <button class="kpi" data-type="road"><i class="dot road"></i><b id="kRoad">0</b><span data-i="tRoad"></span><small>km</small></button>
        </div>
      </section>

      <section class="sec list fl">
        <div class="sec-h"><h2 id="listTitle"></h2></div>
        <ol class="flist" id="flist"></ol>
      </section>

      <section class="sec src">
        <details>
          <summary data-i="srcTitle"></summary>
          <ul class="srcs" id="srcs"></ul>
          <p class="caveat" id="caveat"></p>
        </details>
      </section>
    </aside>
  </main>
</div>

<div class="boot" id="boot"><div class="boot-in"><span class="logo big" aria-hidden="true"><i></i></span><p data-i="loading"></p></div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="i18n.js"></script>
<script src="climate.js"></script>
<script src="app.js"></script>
</body>
</html>
